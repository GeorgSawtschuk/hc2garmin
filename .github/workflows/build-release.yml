name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Tag-Push: APK mit Versionsnummer umbenennen und als Release veröffentlichen
      - name: Rename APK (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/hc2garmin-${{ github.ref_name }}.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/hc2garmin-${{ github.ref_name }}.apk
          generate_release_notes: true

      # Manueller Start: APK als Workflow-Artifact hochladen (kein Release, kein Tag)
      - name: Upload APK as artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hc2garmin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
