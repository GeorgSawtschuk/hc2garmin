[versions]
agp                 = "8.9.1"
kotlin              = "2.1.20"
coreKtx             = "1.13.1"
lifecycleRuntime    = "2.8.7"
activityCompose     = "1.9.3"
composeBom          = "2024.11.00"
navigationCompose   = "2.8.5"
viewmodelCompose    = "2.8.7"
healthConnect       = "1.1.0"
workRuntime         = "2.10.0"
okhttp              = "4.12.0"
gson                = "2.11.0"
securityCrypto      = "1.1.0-alpha06"
coroutines          = "1.9.0"

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx",                              version.ref = "coreKtx" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx",            version.ref = "lifecycleRuntime" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",                  version.ref = "activityCompose" }
androidx-compose-bom        = { module = "androidx.compose:compose-bom",                        version.ref = "composeBom" }
androidx-compose-ui         = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3  = { module = "androidx.compose.material3:material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose",              version.ref = "navigationCompose" }
androidx-viewmodel-compose  = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",      version.ref = "viewmodelCompose" }
androidx-health-connect     = { module = "androidx.health.connect:connect-client",              version.ref = "healthConnect" }
androidx-work-runtime       = { module = "androidx.work:work-runtime-ktx",                      version.ref = "workRuntime" }
androidx-security-crypto    = { module = "androidx.security:security-crypto",                   version.ref = "securityCrypto" }
okhttp                      = { module = "com.squareup.okhttp3:okhttp",                         version.ref = "okhttp" }
okhttp-logging              = { module = "com.squareup.okhttp3:logging-interceptor",            version.ref = "okhttp" }
gson                        = { module = "com.google.code.gson:gson",                           version.ref = "gson" }
coroutines-android          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",    version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",  version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
